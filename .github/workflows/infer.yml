name: infer

on:
  push:
  pull_request:

jobs:
  infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: checkpoints/model_slim.pt
          key: m1-demo-v1-model_slim
      - name: CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test deps
        run: python -m pip install "pytest>=8.0" "numpy>=2.0"
      - name: Public slim proof
        run: make infer
