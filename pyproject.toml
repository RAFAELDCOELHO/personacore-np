[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personacore-np"
version = "0.1.0"
description = "Pure-NumPy forward-only inference engine for the PersonaCore GPT. No PyTorch, no autograd, no KV-cache."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Apple-Silicon only (Metal). Optional on purpose: the NumPy engine and its
# suite must keep running/skipping cleanly on machines without MLX.
mlx = ["mlx"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 280-token parity run, ~90% of the suite's wall-clock. Runs in the normal suite; excluded ONLY from the mutation loop, which reruns the suite 54 times. Measured safe: no mutant has a slow test as its only killer.",
]
